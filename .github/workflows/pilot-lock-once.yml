name: One-time pilot lockfile
on:
  push:
    branches: [experiment/tanstack-start-ssr-pilot-20261016]
    paths:
      - '.github/workflows/pilot-lock-once.yml'
permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: experiment/tanstack-start-ssr-pilot-20261016
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Resolve exact dependency tree
        working-directory: experiments/tanstack-start
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit pilot package-lock
        run: |
          if git diff --quiet -- experiments/tanstack-start/package-lock.json && git ls-files --error-unmatch experiments/tanstack-start/package-lock.json >/dev/null 2>&1; then
            echo "Lockfile unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add experiments/tanstack-start/package-lock.json
          git commit -m "chore(pilot): lock exact TanStack Start dependency tree"
          git push origin HEAD:experiment/tanstack-start-ssr-pilot-20261016
