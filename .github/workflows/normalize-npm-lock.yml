name: One-time npm lock normalization

on:
  push:
    branches: [chore/independent-github-workflow-20261016]

permissions:
  contents: write

jobs:
  normalize:
    if: github.repository == 'hrq16000-a11y/myhostvip'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: chore/independent-github-workflow-20261016
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Regenerate npm lock from package manifest
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit normalized lock
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "Lock already synchronized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: synchronize npm lockfile for clean installs"
          git push origin HEAD:chore/independent-github-workflow-20261016
