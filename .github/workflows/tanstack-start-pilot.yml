name: TanStack Start SSR Pilot

on:
  pull_request:
    paths:
      - 'experiments/tanstack-start/**'
      - '.github/workflows/tanstack-start-pilot.yml'
  push:
    branches:
      - experiment/tanstack-start-ssr-pilot-20261016
    paths:
      - 'experiments/tanstack-start/**'
      - '.github/workflows/tanstack-start-pilot.yml'

permissions:
  contents: read

concurrency:
  group: start-pilot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ssr:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: experiments/tanstack-start
    steps:
      - name: Checkout source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Node 22 (compatible with Start and Vite 8)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Install pilot dependencies (experimental lock pending)
        run: npm install --no-audit --no-fund
      - name: Inspect TanStack dependency alignment
        run: |
          echo "Start manifest dependency:"
          npm view @tanstack/react-start@1.169.2 dependencies --json
          echo "Installed dependency tree:"
          npm ls @tanstack/react-start @tanstack/react-router @tanstack/router-core @tanstack/start-client-core @tanstack/start-server-core || true
      - name: Build SSR with Nitro
        run: npm run build
      - name: Verify real HTML responses from Node server
        run: npm run smoke:ssr
