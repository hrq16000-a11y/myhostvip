name: MyHostVIP SPA to SSR Visual Parity

on:
  pull_request:
    paths:
      - 'experiments/tanstack-start/**'
      - '.github/workflows/ssr-visual-parity.yml'

permissions:
  contents: read

concurrency:
  group: myhostvip-visual-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - name: Install root dependencies
        run: npm ci --no-audit --no-fund
      - name: Install locked SSR dependencies
        run: npm ci --prefix experiments/tanstack-start --no-audit --no-fund
      - name: Build SPA (original production UI)
        run: npm run build
      - name: Build SSR with TanStack and Nitro
        run: npm run build --prefix experiments/tanstack-start
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Compare navigation, text and screenshot both versions
        run: npx playwright test --config experiments/tanstack-start/playwright.visual.config.ts
      - name: Install image comparison dependency in isolated environment
        run: |
          python3 -m venv /tmp/myhostvip-visual-venv
          /tmp/myhostvip-visual-venv/bin/python -m pip install --quiet Pillow==11.3.0
      - name: Compare screenshots pixel by pixel (max 5% visual difference)
        run: /tmp/myhostvip-visual-venv/bin/python experiments/tanstack-start/scripts/check_pixel_diff.py
      - name: Upload screenshots and trace report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: myhostvip-visual-parity-${{ github.run_id }}
          path: |
            experiments/tanstack-start/visual-screenshots/
            experiments/tanstack-start/visual-report/
            experiments/tanstack-start/visual-test-results/
          if-no-files-found: warn
          retention-days: 14
