name: R9 · Comparação comercial
on:
  pull_request:
    paths:
      - 'src/pages/Plans.tsx'
      - 'src/lib/hosting-plans.ts'
      - 'src/components/landing/PricingSection.tsx'
      - 'tests/e2e/r9-plan-comparison.spec.ts'
      - '.github/workflows/r9-commercial-qa.yml'
  workflow_dispatch:
jobs:
  comparison:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test tests/e2e/r9-plan-comparison.spec.ts
