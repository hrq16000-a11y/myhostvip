name: MyHostVIP SSR Browser Check

on:
  pull_request:
    paths:
      - 'experiments/tanstack-start/**'
      - '.github/workflows/ssr-browser.yml'

permissions:
  contents: read

concurrency:
  group: ssr-browser-${{ github.ref }}
  cancel-in-progress: true

jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - name: Install main test tooling from lockfile
        run: npm ci --no-audit --no-fund
      - name: Install locked TanStack pilot dependencies
        run: npm ci --prefix experiments/tanstack-start --no-audit --no-fund
      - name: Build isolated SSR app
        run: npm run build --prefix experiments/tanstack-start
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Desktop and mobile navigation and hydration smoke
        run: npx playwright test --config experiments/tanstack-start/playwright.browser.config.ts
      - name: Collect browser report and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: myhostvip-tanstack-browser-${{ github.run_id }}
          path: |
            experiments/tanstack-start/browser-report/
            experiments/tanstack-start/browser-test-results/
          if-no-files-found: warn
          retention-days: 10
